[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-opt-agent"
version = "0.1.0"
description = "Source-grounded masonry facts and CAD evidence workspace"
requires-python = ">=3.11"
dependencies = [
  "ezdxf==1.4.3", "fastapi==0.136.0", "uvicorn==0.44.0",
  "pydantic==2.13.1", "httpx==0.28.1", "python-multipart==0.0.30", "python-dotenv==1.2.2",
  "PyJWT[crypto]==2.13.0", "shapely==2.1.2", "resvg-py==0.5.0", "tiktoken>=0.12,<1"
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx==0.28.1", "numpy>=1.24"]
retrieval = ["sentence-transformers==5.7.0", "transformers==5.19.0", "torch==2.14.1"]

[tool.setuptools.packages.find]
include = ["cad_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"cad_agent.runtimes" = ["*.mjs"]
"cad_agent.extensions.adaptation" = ["Dockerfile"]
"cad_agent.extensions.table_recovery" = ["Dockerfile"]
